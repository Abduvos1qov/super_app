name: super_app
description: Super-app shell — mini-apps plug into the launcher through a unified platform.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  analytics: any
  auth: any
  core: any
  cupertino_icons: ^1.0.8
  deep_links: any
  demo_mini_app: any
  event_bus: any
  feature_flags: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  mini_app_registry: any
  mini_app_sdk: any
  networking: any
  notifications: any
  payments: any
  permissions: any
  riverpod_annotation: ^2.6.1
  shared_models: any
  shared_ui: any
  storage: any

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
